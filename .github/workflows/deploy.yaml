name: Deploy Terraform

on:
  # Credentialed plans run on pushes to a branch of *this* repository, not on
  # pull requests. The plan role is trusted only for `ref:refs/heads/*` subjects
  # (bootstrap/oidc.tf "Plan role"), and only a push here produces one: a
  # `pull_request` run presents `repo:<owner>/<repo>:pull_request` whether its
  # head branch lives in this repository or in a fork, so that subject cannot be
  # scoped to same-repository pull requests. Pull requests instead get the
  # formatters and a backend-less validate, with no cloud credentials, no
  # repository secrets and no tailnet node.
  push:
    branches:
      - "**"
    # root.hcl and common-inputs.yaml are read by every unit through
    # find_in_parent_folders, so a change to either can affect all of them.
    # bootstrap/** is here so a trust-anchor change gets a plan, even though CI
    # never applies it.
    paths:
      - "root.hcl"
      - "common-inputs.yaml"
      - "bootstrap/**"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    # root.hcl and common-inputs.yaml are read by every unit through
    # find_in_parent_folders, so a change to either can affect all of them.
    # bootstrap/** is here so a trust-anchor change gets a plan, even though CI
    # never applies it.
    paths:
      - "root.hcl"
      - "common-inputs.yaml"
      - "bootstrap/**"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

concurrency:
  # Push and dispatch runs share one group so plan (which writes `<key>.tflock`)
  # and apply never race each other across branches. Pull-request runs are
  # credential-free and touch no state, so they get their own per-ref group;
  # otherwise every branch commit queues a push run and a pull-request run in
  # the same group and GitHub cancels the one that is still pending.
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

env:
  tg_version: '0.97.2'
  tofu_version: '1.11.2'
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # The unit list is discovered, not hand-written: by AGENTS.md a unit is a
  # directory with a terragrunt.hcl under modules/, and every consumer below
  # takes this one JSON. `git ls-files` sees tracked files only, so the copies
  # Terragrunt leaves in .terragrunt-cache are never mistaken for units.
  units:
    name: Discover units
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.units.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # `plan_role` is the unit's plan role name without the `terraform-plan-`
      # family prefix: the unit path with `/` flattened to `-`, which is the
      # name bootstrap/oidc.tf gives it. Workflow expressions have no
      # `replace()`, so it is computed here rather than in the matrix.
      - name: Build the matrix
        id: units
        run: |
          set -euo pipefail
          matrix="$(
            git ls-files 'modules/*/terragrunt.hcl' \
              | sed -e 's|^modules/||' -e 's|/terragrunt.hcl$||' \
              | jq -R -s -c '{include: (split("\n") | map(select(length > 0)) | sort
                                      | map({module: ., plan_role: (gsub("/"; "-"))}))}'
          )"
          # An empty include list is a GitHub error, not an empty fan-out.
          if [ "$(jq '.include | length' <<<"${matrix}")" -eq 0 ]; then
            echo "::error::no units found under modules/; nothing would be validated or planned"
            exit 1
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jq -r '.include[].module' <<<"${matrix}"

  # bootstrap/ is plain OpenTofu: no Terragrunt unit, applied by hand, never by
  # CI. A syntax or format regression there is still worth catching on the pull
  # request, so this job validates it with no credentials and a backend-less
  # init. The credentialed half is `plan-bootstrap` below.
  bootstrap:
    name: Bootstrap (format, validate)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # `tofu` only: this job must not drag Terragrunt in, because bootstrap/ has
      # no terragrunt.hcl to run.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.tofu_version }}
          tofu_wrapper: false

      - name: Terraform Format
        run: tofu fmt -check -recursive
        working-directory: ./bootstrap

      - name: Validate
        run: |
          tofu init -backend=false -input=false
          tofu validate -no-color
        working-directory: ./bootstrap

  # Pull-request entry point. Nothing here can reach the account: no `id-token`,
  # no `secrets`, no `vars` beyond the tool versions. The placeholder values
  # exist only because Terragrunt's get_env() calls need *some* value; the
  # Cloudflare token is shaped like a real one because the provider validates it.
  validate:
    name: Validate (${{ matrix.module }})
    if: github.event_name == 'pull_request'
    needs: units
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.units.outputs.matrix) }}
    env:
      CLOUDFLARE_API_TOKEN: "placeholder0000000000000000000000000000000"
      GOOGLE_OAUTH_CLIENT_ID: "placeholder"
      GOOGLE_OAUTH_CLIENT_SECRET: "placeholder"
      ALLOWED_EMAILS: "nobody@example.invalid"
      SIGNOZ_ENDPOINT: "https://signoz.invalid"
      SIGNOZ_ACCESS_TOKEN: "placeholder"
      TAILSCALE_OAUTH_CLIENT_ID: "placeholder"
      TAILSCALE_OAUTH_CLIENT_SECRET: "placeholder"
      # `terragrunt validate` initialises first; without this it would talk to
      # the S3 backend and need AWS credentials, which pull requests never get.
      TF_CLI_ARGS_init: "-backend=false"
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@5e86476ca61eaf74adb9c0525745f29f921f2199 # v3.1.0
        with:
          tg_version: ${{ env.tg_version }}
          tofu_version: ${{ env.tofu_version }}

      - name: Terraform Format
        run: tofu fmt -check -recursive
        working-directory: ./modules/${{ matrix.module }}

      - name: Terragrunt Validate
        run: terragrunt validate
        working-directory: ./modules/${{ matrix.module }}

      # Regression gate: Terragrunt rewrites `_backend.tf` and `_provider.tf` on
      # every run, and a pre-1.0 Terragrunt writes them into the unit directory
      # rather than into `.terragrunt-cache`. They are gitignored now, so a run
      # can only dirty the tree if a generated file was force-added, or if a unit
      # started interpolating something environment-derived into one. The
      # placeholder CLOUDFLARE_API_TOKEN above makes that second case show up as a
      # modified tracked file instead of a committed credential.
      - name: Check Terragrunt wrote nothing tracked
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git --no-pager diff
            echo "::error::terragrunt modified a tracked file; generated files must stay gitignored (#10)"
            exit 1
          fi

  plan:
    name: Plan (${{ matrix.module }})
    # Belt and braces: the plan role's trust policy only matches push refs, so
    # this guard cannot be the thing that keeps credentials away from a pull
    # request — bootstrap/oidc.tf does that.
    if: github.event_name != 'pull_request'
    needs: units
    permissions:
      contents: read
      id-token: write
      # Posting and rewriting the plan comment on the branch's pull request.
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.units.outputs.matrix) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      SIGNOZ_ENDPOINT: ${{ vars.SIGNOZ_ENDPOINT }}
      SIGNOZ_ACCESS_TOKEN: ${{ secrets.SIGNOZ_ACCESS_TOKEN }}
      # The tailscale unit owns the tailnet policy file. Its provider reads these
      # two environment names itself, so the secrets are named for what they
      # authorise: TS_TF_* is the management credential, distinct from the
      # TS_OAUTH_* pair that mints runner nodes and the TS_PLAN_OAUTH_* pair the
      # plan jobs use.
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_TF_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_TF_OAUTH_SECRET }}
      # Some units talk only to public endpoints - Cloudflare's API, Google's
      # OAuth endpoints, AWS, api.tailscale.com - so their plan gets no tailnet
      # node and no resolver surgery. Everything else reaches 10.0.0.200:6443
      # (the kube API) or 10.0.0.99 through *.cowlab.org, which is only routable
      # over the tailnet. A unit missing from this list keeps the node: the
      # default is the safe one, so a public-only unit has to be added here.
      NEEDS_TAILNET: ${{ !contains(fromJSON('["cloudflare","s3-backups","tailscale"]'), matrix.module) }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 #v5.1.0
        with:
          # One plan role per unit: the S3 prefix a role may read is baked into
          # the role (bootstrap/oidc.tf), so the matrix entry selects the identity
          # as well as the directory. AWS_PLAN_ROLE_ARN holds the family prefix
          # `arn:aws:iam::<account>:role/terraform-plan`, and the units job
          # above supplies `plan_role`.
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}-${{ matrix.plan_role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@5e86476ca61eaf74adb9c0525745f29f921f2199 # v3.1.0
        with:
          tg_version: ${{ env.tg_version }}
          tofu_version: ${{ env.tofu_version }}

      # The action already passes --accept-routes to `tailscale up`, so the
      # separate `tailscale set` step it used to need is gone. --accept-dns=false
      # keeps tailscaled out of DNS entirely: nothing here needs MagicDNS, since
      # the kubeconfig dials the kube-vip IP 10.0.0.200:6443 and every other name
      # is public *.cowlab.org resolved over the route.
      #
      # `tag:ci-plan` is a separate tag from the one apply and smoke use, so a
      # branch plan does not sit in the deploy tag's tailnet policy position
      # (#15). The tag has to be authorized on the OAuth client and granted in
      # the tailnet policy; without both this step fails, and because `apply`
      # needs `plan`, so does every deploy.
      - name: Tailscale
        if: env.NEEDS_TAILNET == 'true'
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-plan
          args: "--accept-dns=false"

      # Accepting Tailscale routes breaks systemd-resolved, whose 127.0.0.53 stub
      # then times out. Writing Google DNS into /etc/resolv.conf is not enough:
      # systemd-resolved owns that path on these runners and rewrites it within
      # seconds, so short jobs passed while the four-minute apply job failed
      # every AWS call with "lookup sts.us-west-1.amazonaws.com on 127.0.0.53:53:
      # i/o timeout". Drop the stub resolver, install a plain file nothing can
      # revert, then fail fast instead of burning minutes in provider retries.
      - name: Fix DNS resolution
        if: env.NEEDS_TAILNET == 'true'
        run: |
          sudo systemctl disable --now systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 8.8.4.4\n' | sudo tee /etc/resolv.conf > /dev/null
          for attempt in 1 2 3 4 5; do
            getent hosts "sts.${AWS_REGION}.amazonaws.com" && break
            echo "DNS not ready (attempt ${attempt}/5); retrying in 3s"
            sleep 3
          done
          getent hosts "sts.${AWS_REGION}.amazonaws.com"
          [ -z "${SIGNOZ_ENDPOINT:-}" ] || getent hosts "${SIGNOZ_ENDPOINT#https://}"

      # Only the argocd-* modules use a kubeconfig-based provider. cloudflare,
      # s3-backups and signoz-dashboards do not, so they should not depend on
      # the KUBECONFIG secret.
      - name: Setup kubeconfig
        if: startsWith(matrix.module, 'argocd-')
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Terraform Format
        run: tofu fmt -check -recursive
        working-directory: ./modules/${{ matrix.module }}

      - name: Terragrunt Validate
        run: terragrunt validate
        working-directory: ./modules/${{ matrix.module }}

      - name: Terragrunt Plan
        env:
          TF_IN_AUTOMATION: true
        run: |
          terragrunt plan -out=tfplan.tfplan
          terragrunt show -json tfplan.tfplan > tfplan.json
        working-directory: ./modules/${{ matrix.module }}

      # The plan job runs on a push, so there is no `pull_request` payload to
      # comment against and the commenter action declines to post (it only acts
      # on pull_request events). It still renders the diff into its
      # `comment-body` output, so find the open pull request whose head is this
      # branch and post that body ourselves, rewriting our previous comment for
      # the module instead of stacking a new one on every push.
      - name: Find the pull request for this branch
        id: pull-request
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open \
            --json number --limit 1 --jq '.[0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # Keeps the old behaviour: no comment when a plan has nothing to report.
      - name: Check the plan has changes
        id: changes
        run: |
          if jq -e '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length > 0' \
            "modules/${{ matrix.module }}/tfplan.json" > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render Plan Changes
        id: plan-comment
        uses: liatrio/terraform-change-pr-commenter@0050454ca62e2839dc35022bfbd474a139c2c65d #v1.14.0
        with:
          json-file: ./modules/${{ matrix.module }}/tfplan.json
          comment-header: "Terraform Plan for ${{ matrix.module }}"
          expand-comment: 'true'
          hide-previous-comments: 'true'
          log-changed-resources: 'false'
          include-workflow-link: 'true'
          quiet: 'true'

      - name: Post Plan Changes
        if: steps.pull-request.outputs.number != '' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          MODULE: ${{ matrix.module }}
          PLAN_BODY: ${{ steps.plan-comment.outputs.comment-body }}
        run: |
          # A stable marker lets a later push rewrite this module's comment
          # rather than posting another copy.
          marker="<!-- terraform-plan: ${MODULE} -->"
          body="$(printf '%s\n%s' "${marker}" "${PLAN_BODY}")"
          existing="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | tail -n 1)"
          if [ -n "${existing}" ]; then
            printf '%s' "${body}" \
              | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                  -F body=@- > /dev/null
            echo "Updated plan comment ${existing} for ${MODULE}"
          else
            printf '%s' "${body}" \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  -F body=@- > /dev/null
            echo "Created plan comment for ${MODULE}"
          fi

  # The trust anchor gets a plan too (#18). bootstrap/ declares the state bucket
  # and every role these jobs assume, and it is applied by hand - so a change to
  # a trust policy used to be reviewed by eye alone. This produces that plan on
  # the same push trigger as the unit plans and comments it on the branch's pull
  # request, exactly like a unit.
  #
  # The identity, `terraform-plan-bootstrap`, reads bootstrap state and the
  # resources bootstrap manages and writes only that state's lock. It also holds
  # no unit credentials - no Cloudflare or SigNoz tokens, no tailnet node, no
  # kubeconfig - because `tofu plan` there needs none of them. Applying
  # bootstrap/ stays a deliberate hand-run step.
  plan-bootstrap:
    name: Plan (bootstrap)
    if: github.event_name != 'pull_request'
    needs: bootstrap
    permissions:
      contents: read
      id-token: write
      # Posting and rewriting the plan comment on the branch's pull request.
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 #v5.1.0
        with:
          # Same family prefix as the unit roles; bootstrap is just another leaf.
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}-bootstrap
          aws-region: ${{ env.AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.tofu_version }}
          tofu_wrapper: false

      - name: Terraform Format
        run: tofu fmt -check -recursive
        working-directory: ./bootstrap

      - name: OpenTofu Plan
        env:
          TF_IN_AUTOMATION: true
        run: |
          tofu init -input=false -no-color
          tofu plan -input=false -no-color -out=tfplan.tfplan
          tofu show -json tfplan.tfplan > tfplan.json
        working-directory: ./bootstrap

      - name: Find the pull request for this branch
        id: pull-request
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open \
            --json number --limit 1 --jq '.[0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Check the plan has changes
        id: changes
        run: |
          if jq -e '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length > 0' \
            "bootstrap/tfplan.json" > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render Plan Changes
        id: plan-comment
        uses: liatrio/terraform-change-pr-commenter@0050454ca62e2839dc35022bfbd474a139c2c65d #v1.14.0
        with:
          json-file: ./bootstrap/tfplan.json
          comment-header: "Terraform Plan for bootstrap"
          expand-comment: 'true'
          hide-previous-comments: 'true'
          log-changed-resources: 'false'
          include-workflow-link: 'true'
          quiet: 'true'

      - name: Post Plan Changes
        if: steps.pull-request.outputs.number != '' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          MODULE: bootstrap
          PLAN_BODY: ${{ steps.plan-comment.outputs.comment-body }}
        run: |
          # Same stable marker as the unit comments, so a later push rewrites
          # this comment instead of stacking another copy.
          marker="<!-- terraform-plan: ${MODULE} -->"
          body="$(printf '%s\n%s' "${marker}" "${PLAN_BODY}")"
          existing="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | tail -n 1)"
          if [ -n "${existing}" ]; then
            printf '%s' "${body}" \
              | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                  -F body=@- > /dev/null
            echo "Updated plan comment ${existing} for ${MODULE}"
          else
            printf '%s' "${body}" \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  -F body=@- > /dev/null
            echo "Created plan comment for ${MODULE}"
          fi

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # A branch-policy rule limits this environment to `main`; it has no required
    # reviewers, because that protection rule is unavailable on this repository's
    # plan. So this is not an approval step: a push to main applies. See AGENTS.md,
    # "environment: deploy".
    environment: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      SIGNOZ_ENDPOINT: ${{ vars.SIGNOZ_ENDPOINT }}
      SIGNOZ_ACCESS_TOKEN: ${{ secrets.SIGNOZ_ACCESS_TOKEN }}
      # The tailscale unit manages the tailnet policy file and the CI OAuth
      # clients. Its provider reads these two environment names itself, so the
      # secrets are named for what they authorise: TS_TF_* is the management
      # credential, distinct from the TS_OAUTH_* pair that mints runner nodes.
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_TF_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_TF_OAUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 #v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@5e86476ca61eaf74adb9c0525745f29f921f2199 # v3.1.0
        with:
          tg_version: ${{ env.tg_version }}
          tofu_version: ${{ env.tofu_version }}

      # The action already passes --accept-routes to `tailscale up`, so the
      # separate `tailscale set` step it used to need is gone. --accept-dns=false
      # keeps tailscaled out of DNS entirely: nothing here needs MagicDNS, since
      # the kubeconfig dials the kube-vip IP 10.0.0.200:6443 and every other name
      # is public *.cowlab.org resolved over the route.
      - name: Tailscale
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: "--accept-dns=false"

      # Accepting Tailscale routes breaks systemd-resolved, whose 127.0.0.53 stub
      # then times out. Writing Google DNS into /etc/resolv.conf is not enough:
      # systemd-resolved owns that path on these runners and rewrites it within
      # seconds, so short jobs passed while the four-minute apply job failed
      # every AWS call with "lookup sts.us-west-1.amazonaws.com on 127.0.0.53:53:
      # i/o timeout". Drop the stub resolver, install a plain file nothing can
      # revert, then fail fast instead of burning minutes in provider retries.
      - name: Fix DNS resolution
        run: |
          sudo systemctl disable --now systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 8.8.4.4\n' | sudo tee /etc/resolv.conf > /dev/null
          for attempt in 1 2 3 4 5; do
            getent hosts "sts.${AWS_REGION}.amazonaws.com" && break
            echo "DNS not ready (attempt ${attempt}/5); retrying in 3s"
            sleep 3
          done
          getent hosts "sts.${AWS_REGION}.amazonaws.com"
          [ -z "${SIGNOZ_ENDPOINT:-}" ] || getent hosts "${SIGNOZ_ENDPOINT#https://}"

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Terraform Format
        run: tofu fmt -check -recursive

      - name: Terragrunt Validate
        run: terragrunt validate -all

      # The apply step runs for minutes, which is exactly the window in which the
      # old fix was silently reverted. Re-assert DNS here so a reverted resolver
      # fails in seconds with an obvious message instead of a provider retry storm.
      - name: Verify DNS still resolves
        run: |
          getent hosts "sts.${AWS_REGION}.amazonaws.com"
          [ -z "${SIGNOZ_ENDPOINT:-}" ] || getent hosts "${SIGNOZ_ENDPOINT#https://}"

      - name: Terragrunt Apply
        uses: gruntwork-io/terragrunt-action@95fc057922e3c3d4cc021a81a213f088f333ddef # v3.0.2
        with:
          tg_version: ${{ env.tg_version }}
          tofu_version: ${{ env.tofu_version }}
          tg_command: "apply --all --non-interactive"
          tg_add_approve: true

  smoke:
    name: Dashboard smoke query
    needs: apply
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      SIGNOZ_ENDPOINT: ${{ vars.SIGNOZ_ENDPOINT }}
      SIGNOZ_ACCESS_TOKEN: ${{ secrets.SIGNOZ_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Same Tailscale and DNS setup as the plan/apply jobs; see the comments
      # there for why --accept-dns=false and the replaced /etc/resolv.conf matter.
      # The wildcard *.cowlab.org record still resolves to the MetalLB IP, which
      # is routed over Tailscale.
      - name: Tailscale
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: "--accept-dns=false"

      - name: Fix DNS resolution
        run: |
          sudo systemctl disable --now systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 8.8.4.4\n' | sudo tee /etc/resolv.conf > /dev/null
          for attempt in 1 2 3 4 5; do
            getent hosts "sts.${AWS_REGION}.amazonaws.com" && break
            echo "DNS not ready (attempt ${attempt}/5); retrying in 3s"
            sleep 3
          done
          getent hosts "sts.${AWS_REGION}.amazonaws.com"
          [ -z "${SIGNOZ_ENDPOINT:-}" ] || getent hosts "${SIGNOZ_ENDPOINT#https://}"

      - name: Run dashboard smoke query
        run: ./scripts/signoz-dashboard-smoke.sh
