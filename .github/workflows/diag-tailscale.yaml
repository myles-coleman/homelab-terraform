name: Tailscale reachability diag

on:
  push:
    branches:
      - feat-signoz-dashboards
  workflow_dispatch: {}

jobs:
  diag:
    name: Diagnose subnet route from runner
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Accept Tailscale routes
        run: sudo tailscale set --accept-routes

      - name: Route table
        run: |
          tailscale status --json 2>/dev/null | jq -r '.Peer[] | select(.HostName=="protecli-vault") | "primaryRoutes=\(.PrimaryRoutes) allowed=\(.AllowedIPs) exitNodeOption=\(.ExitNodeOption)"' || true
          ip route get 10.0.0.200 || true
          ip route get 192.168.1.1 || true

      - name: Forwarding matrix
        run: |
          echo "=== Vault tailnet IP (TSMP) ==="; tailscale ping -c 2 --timeout 5s protecli-vault || true
          echo "=== Vault LAN 192.168.1.1 (DNS) ==="; nc -vz -w6 192.168.1.1 53 || true
          echo "=== Vault LAN 192.168.1.1 ping ==="; ping -c 2 -W 3 192.168.1.1 || true
          echo "=== upstream gw 10.0.0.1 ping ==="; ping -c 2 -W 3 10.0.0.1 || true
          echo "=== homelab 10.0.0.150 ssh ==="; nc -vz -w6 10.0.0.150 22 || true
          echo "=== homelab 10.0.0.150 ping ==="; ping -c 2 -W 3 10.0.0.150 || true
          echo "=== pikvm 10.0.0.175 443 ==="; nc -vz -w6 10.0.0.175 443 || true
          echo "=== kube-vip 10.0.0.200 6443 ==="; nc -vz -w6 10.0.0.200 6443 || true
          echo "=== traefik 10.0.0.99 443 ==="; nc -vz -w6 10.0.0.99 443 || true
