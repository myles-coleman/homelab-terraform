name: Secret scan

# A credential that reaches a commit is the one mistake a revert cannot undo: it
# stays in the objects and has to be rotated. This is why it gets its own
# workflow instead of a job in deploy.yaml, whose `paths` filter skips exactly
# the changes that leak a token - a README, a comment, a workflow env block.
#
# The gate needs no cloud credentials and no secrets of its own, so it runs on
# every push, every pull request, and on demand.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A gate that can be swapped by a moving tag is not a gate, and a release binary
# downloaded over TLS is only as good as the checksum next to it. Bump the
# version and the checksum together, both from the release's own
# gitleaks_<version>_checksums.txt.
env:
  gitleaks_version: "8.30.1"
  # gitleaks_8.30.1_linux_x64.tar.gz
  gitleaks_sha256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The whole history, not only the pushed commit: a secret committed and
          # deleted in a later commit is still readable from the object store.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${asset}"
          printf '%s  %s\n' "${gitleaks_sha256}" "/tmp/${asset}" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps the finding itself out of the job log; the commit, the
      # file, and the rule are still reported, which is all a rotation needs.
      - name: Scan the history for committed credentials
        run: gitleaks git . --redact --no-banner --verbose
