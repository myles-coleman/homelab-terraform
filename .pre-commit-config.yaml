# Local pre-commit hooks for homelab-terraform.
#
# Deliberately narrow: offline formatting and hygiene checks that are safe to run
# on every commit. Validation, planning, and applying stay in CI
# (.github/workflows/deploy.yaml), which needs the kubeconfig, the Tailscale
# route, and cloud credentials that a git hook should never hold.
#
# Hook revs are pinned to release tags; bump them with `pre-commit autoupdate`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # gitleaks matches credential *shapes* rather than a fixed blocklist, which is
  # what detect-private-key is missing: a PEM key hook does not recognise a
  # Cloudflare API token. `-system` reuses the `gitleaks` on PATH, the same
  # assumption the terraform hooks above make about tofu and terragrunt
  # (`nix shell nixpkgs#gitleaks`). CI runs the full-history form of this scan in
  # .github/workflows/secrets.yaml, so the hook is convenience, not the gate.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      # root.hcl sets terraform_binary = "tofu" and CI runs `tofu fmt`, but this
      # hook otherwise prefers a `terraform` binary when both are installed.
      - id: terraform_fmt
        args: [--hook-config=--tf-path=tofu]
      # Runs `terragrunt hcl format` on Terragrunt >= 0.78 (CI pins 0.97.x) and
      # falls back to `hclfmt` on older releases.
      - id: terragrunt_fmt
